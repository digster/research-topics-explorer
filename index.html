<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Vault — Research Vault</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

<style>
/* =============================================================================
   The Vault — light-editorial redesign of the Research Topics Explorer.
   Single page, no framework, no build. Reads window.RESEARCH_DATA (data.js).

   Visual system: a warm "paper" canvas with serif display type, a terracotta
   ink accent, and ONE accent colour per discipline (the primary visual
   encoding). Dataset version drops to a small secondary badge. The Knowledge
   Graph is the only surface on a dark canvas — force graphs read best on dark.

   The prior six-view explorer is preserved verbatim at index.v0.html.
   ============================================================================= */

:root {
  /* --- Paper canvas + ink --- */
  --paper:       #efe7d4;   /* page background */
  --paper-2:     #e9e0cb;   /* recessed surfaces (rails, tracks) */
  --card:        #fbf6ea;   /* raised cards */
  --card-2:      #f5eedd;   /* nested chips inside cards */
  --ink:         #2a2521;   /* primary text */
  --ink-dim:     #6f6552;   /* secondary text */
  --ink-faint:   #9a8e72;   /* tertiary / meta */
  --line:        #ddd1b6;   /* hairline borders */
  --line-2:      #cdbf9f;   /* stronger borders / hover */
  --accent:      #a8442e;   /* terracotta editorial accent */
  --accent-soft: #f0ddd4;   /* accent tint */

  /* Dark canvas tokens — used only by the Knowledge Graph view. */
  --graph-bg:    #15171c;
  --graph-line:  #39414f;
  --graph-text:  #aab2bf;

  /* Worked-on ("Done") wash — soft sage that reads as completion on paper. */
  --marked-bg:     rgba(120, 170, 130, 0.20);
  --marked-accent: #6fae84;
  --marked-ink:    #2f5d3c;

  /* Per-version accents (secondary). Any version beyond these falls back to a
     deterministic generated hue at boot (see versionColor), so new CSV
     versions still render a distinct badge with no CSS edit. */
  --accent-v5: #5b7aa8;
  --accent-v6: #8a6fb0;
  --accent-v7: #4f9e8c;
  --accent-v8: #c0884a;
  --accent-v9: #b56a8a;

  --radius: 8px;
  --radius-lg: 12px;

  /* Left-rail widths (drag-adjustable; persisted to localStorage). */
  --cat-rail-w: 220px;
  --reader-rail-w: 230px;
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  --sans:  -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono:  ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 14px/1.55 var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
/* Faint dot grid — quiet "research notebook" texture, flat (no gradients). */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(rgba(42,37,33,0.045) 1px, transparent 1px);
  background-size: 22px 22px;
}

button { font-family: inherit; }
::selection { background: var(--accent-soft); }

/* ---------- App shell ---------- */
#app {
  position: relative; z-index: 1;
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100vh;
}

/* ---------- Header ---------- */
header {
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--paper) 70%, #fff 8%);
  padding: 14px 26px 0;
}
.head-top {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 20px;
}
.brand {
  font: 500 26px/1 var(--serif);
  letter-spacing: -0.01em;
  color: var(--ink);
}
.brand em { font-style: italic; color: var(--accent); }
.brand .tagline {
  display: block; margin-top: 5px;
  font: 11px/1 var(--mono); letter-spacing: 0.14em;
  color: var(--ink-faint); text-transform: uppercase;
}
.progress { text-align: right; }
.progress .nums { font: 12px var(--mono); color: var(--ink-dim); }
.progress .nums b { color: var(--ink); font-weight: 600; }
.progress .meter {
  width: 170px; height: 6px; margin: 8px 0 0 auto;
  background: var(--paper-2); border-radius: 99px; overflow: hidden;
}
.progress .meter i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 200ms; }

/* Tabs */
nav.tabs { display: flex; gap: 2px; margin-top: 12px; }
nav.tabs button {
  background: transparent; border: 0;
  color: var(--ink-dim);
  font: 13px var(--sans);
  padding: 10px 14px 12px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: inline-flex; align-items: center; gap: 7px;
}
nav.tabs button .n { font: 11px var(--mono); color: var(--ink-faint); }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button.active { color: var(--ink); font-weight: 500; border-bottom-color: var(--accent); }
nav.tabs button.active .n { color: var(--accent); }

/* ---------- Main view container ---------- */
main {
  position: relative;
  overflow: hidden;
  background: var(--paper);
}
.view { position: absolute; inset: 0; display: none; }
.view.active { display: block; overflow: auto; }

/* ---------- Inputs ---------- */
input[type="search"], input[type="text"] {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--line-2);
  color: var(--ink);
  padding: 8px 11px;
  border-radius: var(--radius);
  font: 13px var(--sans);
  outline: none;
}
input::placeholder { color: var(--ink-faint); }
input[type="search"]:focus, input[type="text"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

/* ---------- Shared chips / badges ---------- */
.badge {
  display: inline-block; padding: 2px 7px; border-radius: 99px;
  font: 10px/1.3 var(--mono); letter-spacing: 0.04em; text-transform: uppercase;
  border: 1px solid transparent;
}
.badge.ver { background: var(--card-2); color: var(--ink-dim); border-color: var(--line); }
.disc-tag {
  display: inline-block; padding: 2px 8px; border-radius: 99px;
  font: 10px/1.35 var(--sans); font-weight: 500;
}

/* =============================================================================
   Worked-on ("Done") toggle + mirrored wash (Catalog cards + Reader rows)
   ============================================================================= */
.mark-toggle {
  flex-shrink: 0; width: 22px; height: 22px;
  border: 1px solid var(--line-2); border-radius: 6px;
  background: transparent; color: var(--ink-faint);
  font-size: 12px; line-height: 1; cursor: pointer; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background 120ms, color 120ms, border-color 120ms;
}
.mark-toggle:hover { color: var(--ink-dim); border-color: var(--ink-faint); }
.mark-toggle.on {
  background: var(--marked-accent); border-color: var(--marked-accent); color: #fff;
}
.topic-card.marked { background: var(--marked-bg); }
.reader-topic.marked { background: var(--marked-bg); }

/* =============================================================================
   Catalog view
   ============================================================================= */
#catalog.active { display: grid; grid-template-columns: var(--cat-rail-w) 6px minmax(0, 1fr); overflow: hidden; }
.cat-rail {
  height: 100%; overflow: auto;
  border-right: 1px solid var(--line);
  padding: 20px 16px 40px;
  background: color-mix(in srgb, var(--paper) 60%, #fff 6%);
}
.cat-results { height: 100%; overflow: auto; padding: 18px 24px 60px; }

/* Draggable divider that sits in its own 6px grid track and resizes the rail. */
.rail-resizer { cursor: col-resize; position: relative; height: 100%; }
.rail-resizer::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%;
  width: 1px; transform: translateX(-50%);
  background: var(--line); transition: background 120ms, width 120ms;
}
.rail-resizer:hover::after, .rail-resizer.dragging::after { width: 3px; background: var(--accent); }
body.col-resizing { cursor: col-resize; user-select: none; }

.filter-group { margin-bottom: 20px; }
.filter-group h3 {
  font: 10px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent); margin: 0 0 9px; font-weight: 600;
}
.filter-group label {
  display: flex; align-items: center; gap: 8px;
  padding: 3px 0; font-size: 12.5px; color: var(--ink-dim);
  cursor: pointer; user-select: none;
}
.filter-group label:hover { color: var(--ink); }
.filter-group label input { accent-color: var(--accent); margin: 0; }
.filter-group .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.filter-group .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filter-group .cnt { color: var(--ink-faint); font: 10px var(--mono); }
.reset-btn {
  width: 100%; margin-top: 4px;
  background: var(--card); border: 1px solid var(--line-2); color: var(--ink-dim);
  padding: 7px 12px; border-radius: var(--radius); font: 11px var(--mono); cursor: pointer;
}
.reset-btn:hover { color: var(--ink); border-color: var(--ink-faint); }

.cat-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
}
.cat-toolbar .count { font: 12px var(--sans); color: var(--ink-dim); }
.cat-toolbar .count b { color: var(--ink); font-weight: 600; }
.sorts { display: flex; gap: 6px; }
.sorts button {
  background: transparent; border: 1px solid var(--line-2); color: var(--ink-dim);
  font: 11.5px var(--sans); padding: 5px 11px; border-radius: 99px; cursor: pointer;
}
.sorts button:hover { color: var(--ink); }
.sorts button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.cards-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px;
}
.topic-card {
  background: var(--card); border: 1px solid var(--line);
  border-left: 3px solid var(--ink-faint);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 13px 15px; cursor: pointer;
  display: flex; flex-direction: column; gap: 8px; min-height: 118px;
  transition: border-color 110ms, transform 110ms, box-shadow 110ms;
}
.topic-card:hover { border-color: var(--line-2); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(42,37,33,0.06); }
.topic-card .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.topic-card .name { font: 500 15px/1.28 var(--serif); color: var(--ink); }
.topic-card .figures { font: italic 12px/1.5 var(--sans); color: var(--ink-dim); }
.topic-card .meta {
  margin-top: auto; display: flex; align-items: center; gap: 12px;
  font: 10.5px var(--mono); color: var(--ink-faint);
}
.topic-card .meta .links { margin-left: auto; }

/* =============================================================================
   Knowledge Graph view (dark canvas)
   ============================================================================= */
#graph { background: var(--graph-bg); }
.force-graph { width: 100%; height: 100%; cursor: grab; }
.force-graph:active { cursor: grabbing; }
.force-graph .node { cursor: pointer; }
.force-graph .node text {
  display: none;                                  /* hidden by default; revealed adaptively */
  font: 11px var(--sans); fill: var(--graph-text);
  pointer-events: none; text-anchor: middle; dominant-baseline: middle;
}
.force-graph .node text.show { display: block; }   /* zoom/importance reveal */
.force-graph .node:hover text { display: block; }  /* always show on hover */
.force-graph .node.dim circle, .force-graph .node.dim text { opacity: 0.16; }
.force-graph .node.highlight circle { stroke: #fff; stroke-width: 2; }
.force-graph .node.highlight text { display: block; fill: #fff; font-weight: 600; }
.force-graph .link { stroke: var(--graph-line); stroke-opacity: 0.5; stroke-width: 0.7; }
.force-graph .link.dim { stroke-opacity: 0.05; }
.force-graph .link.highlight { stroke: #d8a08c; stroke-opacity: 0.9; stroke-width: 1.5; }

.graph-overlay {
  position: absolute; bottom: 16px; left: 16px; max-width: 280px;
  background: rgba(21,23,28,0.86); backdrop-filter: blur(6px);
  border: 1px solid #2c3340; border-radius: var(--radius);
  padding: 12px 14px; font: 11px var(--mono); color: var(--graph-text);
  display: flex; flex-direction: column; gap: 10px;
}
.graph-overlay h4 { margin: 0 0 6px; font: 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: #7e8696; }
.graph-overlay .disc-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
.graph-overlay .disc-legend span { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: #c4cad4; }
.graph-overlay .swatch { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.graph-overlay .ver-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.graph-overlay .ver-chip {
  border: 1px solid #39414f; color: #c4cad4; padding: 3px 8px; border-radius: 99px;
  cursor: pointer; font-size: 10.5px; user-select: none;
}
.graph-overlay .ver-chip.off { opacity: 0.4; text-decoration: line-through; }
.graph-overlay .gbtns { display: flex; gap: 6px; }
.graph-overlay button {
  background: transparent; border: 1px solid #39414f; color: #c4cad4;
  padding: 4px 9px; border-radius: 5px; cursor: pointer; font: 10.5px var(--mono);
}
.graph-overlay button:hover { color: #fff; border-color: #55607080; }

/* =============================================================================
   Thinkers view
   ============================================================================= */
#thinkers.active { padding: 26px 30px 60px; }
.thinkers-head { max-width: 760px; margin-bottom: 22px; }
.thinkers-head h2 { font: 500 30px/1.1 var(--serif); margin: 0 0 4px; letter-spacing: -0.01em; }
.thinkers-head .sub { font: 13px var(--sans); color: var(--ink-dim); margin: 0 0 14px; }
.thinkers-head input { max-width: 360px; }
.thinkers-section-title {
  font: 500 17px var(--serif); color: var(--ink); margin: 4px 0 14px;
}
.thinkers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.thinker-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 14px 15px;
}
.tc-head { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }
.tc-name { font: 500 16px var(--serif); color: var(--ink); }
.tc-count {
  font: 10px var(--mono); color: var(--accent); background: var(--accent-soft);
  width: 19px; height: 19px; border-radius: 50%; display: inline-flex;
  align-items: center; justify-content: center; flex-shrink: 0;
}
.tc-profile {
  margin-left: auto; background: transparent; border: 1px solid var(--line-2);
  color: var(--ink-dim); font: 10.5px var(--sans); padding: 3px 9px;
  border-radius: 99px; cursor: pointer;
}
.tc-profile:hover { color: var(--accent); border-color: var(--accent); }
.tc-topics { display: flex; flex-direction: column; gap: 6px; }
.chip-line {
  font: 12.5px/1.35 var(--sans); color: var(--ink-dim);
  padding: 6px 9px; background: var(--card-2); border: 1px solid var(--line);
  border-radius: 6px; cursor: pointer;
}
.chip-line:hover { color: var(--ink); border-color: var(--line-2); }
.thinkers-empty { color: var(--ink-faint); font: 13px var(--sans); padding: 20px 0; }

/* =============================================================================
   Reader view (focused, one discipline at a time)
   ============================================================================= */
#reader.active { display: grid; grid-template-columns: var(--reader-rail-w) 6px minmax(0, 1fr) 250px; overflow: hidden; }
.reader-rail { height: 100%; overflow: auto; border-right: 1px solid var(--line); padding: 24px 18px 40px; }
.reader-main { height: 100%; overflow: auto; padding: 30px 40px 80px; }
.reader-aside { height: 100%; overflow: auto; border-left: 1px solid var(--line); padding: 26px 20px 40px; background: color-mix(in srgb, var(--paper) 60%, #fff 6%); }

.reader-rail .rail-title, .reader-aside .aside-title {
  font: 10px var(--mono); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-faint); margin: 0 0 12px;
}
.path-item {
  display: flex; align-items: baseline; gap: 9px; padding: 7px 8px;
  border-radius: 6px; cursor: pointer; color: var(--ink-dim); font-size: 13px; line-height: 1.3;
}
.path-item:hover { background: var(--paper-2); color: var(--ink); }
.path-item.current { background: var(--card); color: var(--ink); font-weight: 500; box-shadow: inset 2px 0 0 var(--accent); }
.path-item .pi-num { font: 11px var(--mono); color: var(--ink-faint); width: 16px; flex-shrink: 0; }
.path-item.current .pi-num { color: var(--accent); }
.path-item .pi-check { margin-left: auto; color: var(--marked-accent); font-size: 12px; }

.reader-main .crumb { font: 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px; }
.reader-main .crumb .dot-c { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: 1px; margin-right: 6px; }
.reader-main .ph-head { display: flex; align-items: baseline; gap: 18px; margin-bottom: 14px; }
.reader-main .ph-num { font: 500 56px/0.9 var(--serif); color: var(--line-2); }
.reader-main h1 { font: 500 34px/1.1 var(--serif); margin: 0; letter-spacing: -0.01em; color: var(--ink); }
.reader-main .lead {
  font: italic 15px/1.6 var(--serif); color: var(--ink-dim);
  border-left: 3px solid var(--accent-soft); padding: 4px 0 4px 16px;
  margin: 0 0 26px; max-width: 640px;
}
.reader-main .in-phase {
  font: 10px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint);
  border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 6px;
  display: flex; justify-content: space-between;
}
.reader-topic {
  display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 12px;
  padding: 16px 10px 16px 4px; border-bottom: 1px solid var(--line);
  cursor: pointer; align-items: start;
}
.reader-topic:hover { background: var(--card); }
.reader-topic .rt-num { font: 12px var(--mono); color: var(--ink-faint); padding-top: 3px; }
.reader-topic .rt-name { font: 500 18px/1.25 var(--serif); color: var(--ink); }
.reader-topic .rt-excerpt { grid-column: 2; font: 13px/1.55 var(--sans); color: var(--ink-dim); margin-top: 4px; }
.reader-topic .rt-figures { grid-column: 2; font: 11px var(--mono); color: var(--ink-faint); margin-top: 7px; }
.reader-topic .mark-toggle { grid-row: 1; grid-column: 3; }

.up-next {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 15px 16px; margin-bottom: 24px;
}
.up-next .un-kicker { font: 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
.up-next .un-phase { font: 11px var(--mono); color: var(--accent); margin: 6px 0 2px; }
.up-next h3 { font: 500 18px/1.2 var(--serif); margin: 0 0 7px; color: var(--ink); }
.up-next p { font: 13px/1.5 var(--sans); color: var(--ink-dim); margin: 0 0 10px; }
.up-next .un-go { background: transparent; border: 0; color: var(--accent); font: 12px var(--sans); cursor: pointer; padding: 0; }
.up-next .un-go:hover { text-decoration: underline; }
.ten-list .tl-item {
  display: flex; justify-content: space-between; gap: 10px; padding: 7px 0;
  border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; color: var(--ink-dim);
}
.ten-list .tl-item:hover { color: var(--ink); }
.ten-list .tl-item.current { color: var(--ink); font-weight: 500; }
.ten-list .tl-item .tl-cnt { font: 11px var(--mono); color: var(--ink-faint); }

/* =============================================================================
   Hubs view (carried over from v0)
   ============================================================================= */
#hubs.active { padding: 28px 34px 60px; }
#hubs h2 { font: 500 26px var(--serif); margin: 0 0 4px; letter-spacing: -0.01em; }
#hubs .sub { font: 13px/1.55 var(--sans); color: var(--ink-dim); margin: 0 0 18px; max-width: 720px; }
.hubs-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
.hubs-tabs button {
  background: transparent; border: 1px solid var(--line-2); color: var(--ink-dim);
  font: 11.5px var(--sans); padding: 6px 13px; border-radius: 99px; cursor: pointer;
}
.hubs-tabs button:hover { color: var(--ink); }
.hubs-tabs button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.hub-row {
  display: grid; grid-template-columns: 330px 1fr 54px; align-items: center; gap: 12px;
  padding: 6px 8px; cursor: pointer; border-radius: 6px;
}
.hub-row:hover { background: var(--card); }
.hub-row .name { font: 14px var(--sans); color: var(--ink); }
.hub-row .name .dim { color: var(--ink-faint); font: 10px var(--mono); margin-left: 7px; }
.hub-row .bar-wrap { background: var(--paper-2); height: 15px; border-radius: 4px; overflow: hidden; }
.hub-row .bar { height: 100%; border-radius: 4px; transition: width 220ms; }
.hub-row .num { font: 12px var(--mono); color: var(--ink-dim); text-align: right; }

/* =============================================================================
   Detail panel (slide-over)
   ============================================================================= */
.panel {
  position: absolute; top: 0; right: 0; height: 100%; width: 390px; z-index: 30;
  background: var(--card); border-left: 1px solid var(--line);
  overflow: auto; padding: 22px 24px 60px;
  transform: translateX(103%); transition: transform 220ms ease;
}
.panel.open { transform: none; box-shadow: -14px 0 36px rgba(42,37,33,0.12); }
.panel .close {
  position: absolute; top: 16px; right: 16px;
  background: transparent; border: 1px solid var(--line-2); color: var(--ink-dim);
  width: 28px; height: 28px; border-radius: 7px; cursor: pointer; font-size: 15px; line-height: 1;
}
.panel .close:hover { color: var(--ink); border-color: var(--ink-faint); }
.panel .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; padding-right: 36px; }
.panel h2 { font: 500 23px/1.25 var(--serif); margin: 0 0 8px; color: var(--ink); }
.panel .figures { font: italic 13px/1.55 var(--serif); color: var(--ink-dim); margin-bottom: 16px; }
.panel .description { font-size: 14px; line-height: 1.72; color: var(--ink); margin-bottom: 6px; }
.panel .description p { margin: 0 0 12px; }
.panel h4 {
  font: 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent); margin: 20px 0 9px; font-weight: 600;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: var(--card-2); border: 1px solid var(--line); color: var(--ink-dim);
  padding: 4px 10px; border-radius: 99px; font: 12px var(--sans); cursor: pointer;
}
.chip:hover { color: var(--ink); border-color: var(--line-2); }
.chip.unresolved { color: var(--ink-faint); cursor: default; opacity: 0.6; }
.panel .source { margin-top: 24px; font: 11px var(--mono); color: var(--ink-faint); }
.panel .source code { color: var(--ink-dim); }

/* ---------- Scrollbars + helpers ---------- */
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; border: 3px solid var(--paper); }
#graph ::-webkit-scrollbar-thumb { border-color: var(--graph-bg); }
.muted { color: var(--ink-faint); }
.empty-note { color: var(--ink-faint); font: 13px var(--sans); padding: 30px 4px; font-style: italic; }
</style>
</head>

<body>

<div id="app">
  <header>
    <div class="head-top">
      <div class="brand">The <em>Vault</em><span class="tagline" id="tagline"></span></div>
      <div class="progress">
        <div class="nums" id="progress-nums"></div>
        <div class="meter"><i id="progress-bar"></i></div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="catalog" class="active"><span class="n">01</span>Catalog</button>
      <button data-view="graph"><span class="n">02</span>Knowledge Graph</button>
      <button data-view="thinkers"><span class="n">03</span>Thinkers</button>
      <button data-view="reader"><span class="n">04</span>Reader</button>
      <button data-view="hubs"><span class="n">05</span>Hubs</button>
    </nav>
  </header>

  <main>
    <div id="catalog"  class="view active"></div>
    <div id="graph"    class="view"></div>
    <div id="thinkers" class="view"></div>
    <div id="reader"   class="view"></div>
    <div id="hubs"     class="view"></div>

    <section class="panel" id="panel"></section>
  </main>
</div>

<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@13/marked.min.js"></script>

<script>
"use strict";

/* =============================================================================
   The Vault — main app script.
   Everything below derives from window.RESEARCH_DATA (generated by parse.mjs).
   No data-pipeline edits: the redesign re-presents the same payload through
   new lenses (discipline colour, priority lane, person index) computed at boot.
   ============================================================================= */

const DATA   = window.RESEARCH_DATA;
const TOPICS = DATA.topics;
const EDGES  = DATA.edges;
const TOPIC_BY_ID = new Map(TOPICS.map(t => [t.id, t]));

const el = (id) => document.getElementById(id);
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

/* --- Versions (version-agnostic, exactly as v0) ----------------------------- */
function versionNum(v) {
  const n = Number(String(v).replace(/^v/i, ""));
  return Number.isNaN(n) ? Infinity : n;
}
const ALL_VERSIONS = [...new Set(TOPICS.map(t => t.version))]
  .sort((a, b) => versionNum(a) - versionNum(b) || a.localeCompare(b));
const VERSION_COUNTS = new Map(ALL_VERSIONS.map(v => [v, TOPICS.filter(t => t.version === v).length]));
function versionColor(v) {
  const picked = getComputedStyle(document.documentElement).getPropertyValue(`--accent-${v}`).trim();
  if (picked) return picked;
  const hue = (versionNum(v) * 137.508) % 360;        // golden-angle fallback
  return `hsl(${hue.toFixed(1)} 45% 55%)`;
}

/* --- Disciplines: the 10 thematic groupings become the primary colour key --- */
const DISCIPLINES = [...((DATA && DATA.disciplines) || [])].sort((a, b) => a.phase - b.phase);

// One accent per discipline phase (1..10). Muted hues that hold up on cream.
const DISCIPLINE_COLORS = {
  1:"#b5462f", 2:"#b0566f", 3:"#c08a2d", 4:"#a8842a", 5:"#6f8f4e",
  6:"#2f8f7f", 7:"#5f7d3a", 8:"#3f6fa0", 9:"#5a5a9c", 10:"#7a5a9c",
};
const DISC_FALLBACK = "#8a7d63";
function discColor(phase) { return DISCIPLINE_COLORS[phase] || DISC_FALLBACK; }
// Soft tint + dark ink derived from a discipline colour, for tag chips.
const discTint = (c) => `color-mix(in srgb, ${c} 15%, var(--card))`;
const discInk  = (c) => `color-mix(in srgb, ${c} 80%, var(--ink))`;

// topic.id -> { phase, name, color }. Each topic sits in exactly one discipline.
const DISCIPLINE_OF = new Map();
for (const d of DISCIPLINES) {
  for (const entry of d.topics) {
    if (entry.targetId) DISCIPLINE_OF.set(entry.targetId, { phase: d.phase, name: d.name, color: discColor(d.phase) });
  }
}
function discOf(topicId) { return DISCIPLINE_OF.get(topicId) || { phase: null, name: "Unsorted", color: DISC_FALLBACK }; }

/* --- Priority lane: derived from groupLabel keywords (Catalog filter only) --- */
const LANES = ["Start here", "Foundations", "Deep dives", "Niche & emerging", "Thinkers & texts"];
function laneOf(t) {
  const g = (t.groupLabel || "").toLowerCase();
  if (/core bridges|high-leverage|start here/.test(g))                                   return "Start here";
  if (/individual thinkers|creators|books|seminal|texts|non-western|comparative/.test(g)) return "Thinkers & texts";
  if (/foundations|disciplines & fields|representation/.test(g))                          return "Foundations";
  if (/deep[- ]dive|specialist|scientific & technical|craft/.test(g))                     return "Deep dives";
  if (/niche|emerging|speculative|cross-cutting/.test(g))                                 return "Niche & emerging";
  return "Foundations";
}
const LANE_OF = new Map(TOPICS.map(t => [t.id, laneOf(t)]));
const LANE_COUNTS = new Map(LANES.map(L => [L, TOPICS.filter(t => LANE_OF.get(t.id) === L).length]));

/* --- Thinkers index: keyFigures aggregated across topics -------------------- */
// `key_figures` is a single free-text column reused across heterogeneous node
// types (people, books, crafts, concepts), so it also holds publication years,
// work titles, and concept terms that aren't people. The Thinkers view claims
// to be "people", so we filter those out at display time. The heuristic catches
// the ~104 reliably non-name tokens with near-zero false positives (no real
// person name is all-lowercase, contains a digit, or is wrapped in quotes).
// Capitalised book/institution titles can't be told apart from names without a
// curated list, so they intentionally remain.
function looksLikePerson(s) {
  if (/\d/.test(s)) return false;                          // years, editions, "4′33″", "4x4 House"
  if (/^['"‘“]/.test(s)) return false;           // 'quoted phrase' / "title"
  if (!/[A-ZÀ-Þ]/.test(s) && /[a-z]/.test(s)) return false; // all-lowercase concept term
  return true;
}
// Built fresh per render so the version filter narrows it; also drives the
// "N people across M topics" headline.
function buildThinkerIndex(topics) {
  const map = new Map();                    // person -> [topicId, ...]
  for (const t of topics) {
    for (const f of t.keyFigures) {
      const k = f.trim(); if (!k || !looksLikePerson(k)) continue;
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(t.id);
    }
  }
  return map;
}
// Creator topic-nodes (people that are themselves topics) — for "profile" links.
const CREATORS = new Set((DATA && DATA.creators) || []);
const CREATOR_NODES = [...CREATORS].map(id => TOPIC_BY_ID.get(id)).filter(Boolean);
function creatorNodeFor(person) {
  const p = person.toLowerCase();
  return (CREATOR_NODES.find(t => t.name.toLowerCase().includes(p)) || null);
}

/* =============================================================================
   Global state + persistence
   ============================================================================= */
const MARKED_KEY = "rte:markedTopics";
function loadMarked() { try { return JSON.parse(localStorage.getItem(MARKED_KEY) || "[]"); } catch { return []; } }
function saveMarked() { try { localStorage.setItem(MARKED_KEY, JSON.stringify([...STATE.markedIds])); } catch { /* private mode */ } }

// Persisted left-rail widths (Catalog + Reader).
const CAT_RAIL_KEY = "rte:catRailW";
const READER_RAIL_KEY = "rte:readerRailW";

/* -----------------------------------------------------------------------------
   makeRailResizer — turns a thin divider element into a drag handle that resizes
   a sidebar by writing a width (px) into a CSS variable on the grid container,
   then persists the final width to localStorage. Applies any saved width up front.
   container: grid element (#catalog/#reader) owning the CSS var.
   railEl:    the <aside> being resized (used to read the live start width).
   --------------------------------------------------------------------------- */
function makeRailResizer(handle, container, railEl, cssVar, storageKey) {
  if (!handle || !container || !railEl) return;

  // Restore a previously chosen width.
  const saved = parseFloat(localStorage.getItem(storageKey) || "");
  if (!Number.isNaN(saved)) container.style.setProperty(cssVar, saved + "px");

  // Keep the rail usable and never let the content column collapse.
  const clampW = (w) => {
    const max = Math.min(520, container.getBoundingClientRect().width - 360);
    return Math.max(170, Math.min(max, w));
  };

  let startX = 0, startW = 0;
  handle.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    handle.classList.add("dragging");
    document.body.classList.add("col-resizing");
    startX = e.clientX;
    startW = railEl.getBoundingClientRect().width;
  });
  handle.addEventListener("pointermove", (e) => {
    if (!handle.classList.contains("dragging")) return;   // only while a drag is active
    container.style.setProperty(cssVar, clampW(startW + (e.clientX - startX)) + "px");
  });
  const end = () => {
    if (!handle.classList.contains("dragging")) return;
    handle.classList.remove("dragging");
    document.body.classList.remove("col-resizing");
    try { localStorage.setItem(storageKey, String(Math.round(railEl.getBoundingClientRect().width))); } catch { /* private mode */ }
  };
  handle.addEventListener("pointerup", end);
  handle.addEventListener("pointercancel", end);
}

const STATE = {
  view: "catalog",
  selectedId: null,
  search: "",
  thinkerQuery: "",
  // Each filter group's Set holds exactly the checked boxes. The default is a full Set
  // (everything checked); an empty Set means "no constraint" (that facet shows all). So
  // "Unselect all" empties every group and the catalog stays unconstrained until the user
  // checks the one or few boxes they actually want.
  versions:    new Set(ALL_VERSIONS),
  disciplines: new Set(DISCIPLINES.map(d => d.phase)),
  lanes:       new Set(LANES),
  progress:    new Set(["toread", "done"]),
  cardsSort:   "discipline",
  hubsMode:    "indegree",
  readerPhase: DISCIPLINES.length ? DISCIPLINES[0].phase : 1,
  markedIds:   new Set(loadMarked()),
};

/* --- Shared visibility filter (drives every view) --------------------------- */
function isTopicVisible(t) {
  // Faceted filtering: a group constrains the results only when it has selections. An
  // empty group means "no constraint" (that facet shows all), so unchecking every box in
  // a group is equivalent to checking them all, and "Unselect all" leaves the full
  // catalog visible until the user checks the one or few boxes they want.
  if (STATE.versions.size > 0 && !STATE.versions.has(t.version)) return false;
  if (STATE.disciplines.size > 0 && !STATE.disciplines.has(discOf(t.id).phase)) return false;
  if (STATE.lanes.size > 0 && !STATE.lanes.has(LANE_OF.get(t.id))) return false;
  if (STATE.progress.size > 0) {
    const p = STATE.markedIds.has(t.id) ? "done" : "toread";
    if (!STATE.progress.has(p)) return false;
  }
  if (STATE.search) {
    const hay = `${t.name} ${t.keyFigures.join(" ")} ${t.description}`.toLowerCase();
    if (!hay.includes(STATE.search)) return false;
  }
  return true;
}
function visibleTopics() { return TOPICS.filter(isTopicVisible); }

/* --- Worked-on ("Done") toggle --------------------------------------------- */
function toggleMarked(id) {
  if (STATE.markedIds.has(id)) STATE.markedIds.delete(id);
  else STATE.markedIds.add(id);
  saveMarked();
  updateProgressMeter();
  // Re-render only the surfaces that show the wash; keep search focus intact.
  if (STATE.view === "catalog") renderCatalogResults();
  if (STATE.view === "reader")  renderReader();
}
function updateProgressMeter() {
  const done = STATE.markedIds.size, total = TOPICS.length;
  el("progress-nums").innerHTML = `<b>${done}</b> done · <b>${total}</b> total`;
  el("progress-bar").style.width = `${total ? (done / total * 100).toFixed(1) : 0}%`;
}

/* =============================================================================
   Tabs / view switching
   ============================================================================= */
el("tabs").addEventListener("click", e => {
  const btn = e.target.closest("button[data-view]");
  if (btn) setView(btn.dataset.view);
});
function setView(v) {
  STATE.view = v;
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  document.querySelectorAll(".view").forEach(elv => elv.classList.toggle("active", elv.id === v));
  syncHash();
  renderCurrentView();
}
function renderCurrentView() {
  switch (STATE.view) {
    case "catalog":  renderCatalog();  break;
    case "graph":    renderGraph();    break;
    case "thinkers": renderThinkers(); break;
    case "reader":   renderReader();   break;
    case "hubs":     renderHubs();     break;
  }
}
// Filter changes: re-render the active view (and the always-cheap meter).
function onFiltersChanged() { renderCurrentView(); }

/* =============================================================================
   Detail panel (slide-over) — shared by every view
   ============================================================================= */
function selectTopic(id) {
  STATE.selectedId = id;
  syncHash();
  renderPanel();
  if (STATE.view === "graph") highlightGraphNeighborhood(id);
}
function closePanel() {
  STATE.selectedId = null;
  el("panel").classList.remove("open");
  syncHash();
  if (graphState) {                                  // clear any graph highlight
    graphState.node.classed("dim", false).classed("highlight", false);
    graphState.link.classed("dim", false).classed("highlight", false);
  }
}
function renderPanel() {
  const panel = el("panel");
  if (!STATE.selectedId) { panel.classList.remove("open"); return; }
  const t = TOPIC_BY_ID.get(STATE.selectedId);
  if (!t) { panel.classList.remove("open"); return; }

  const d = discOf(t.id);
  const incoming = TOPICS.filter(o => o.connections.some(c => c.targetId === t.id));
  const isCreator = /Individual Thinkers & Creators/i.test(t.groupLabel);

  panel.innerHTML = `
    <button class="close" id="panel-close" aria-label="Close">&times;</button>
    <div class="badges">
      ${d.phase ? `<span class="disc-tag" style="background:${discTint(d.color)}; color:${discInk(d.color)};">${escapeHtml(d.name)}</span>` : ""}
      <span class="badge ver">${t.version}</span>
      <span class="badge ver">${escapeHtml(LANE_OF.get(t.id))}</span>
      <span class="badge ver">in ${t.inDegree} · out ${t.outDegree}</span>
    </div>
    <h2>${escapeHtml(t.name)}</h2>
    ${t.keyFigures.length ? `<div class="figures">${escapeHtml(t.keyFigures.join(", "))}</div>` : ""}
    <div class="description">${marked.parse(t.description || "")}</div>

    ${t.connections.length ? `
      <h4>Outgoing — ${isCreator ? "resonates with" : "connects to"} (${t.connections.length})</h4>
      <div class="chips">
        ${t.connections.map(c => c.targetId
          ? `<span class="chip" data-id="${c.targetId}">${escapeHtml(c.raw)}</span>`
          : `<span class="chip unresolved" title="No matching topic in this dataset">${escapeHtml(c.raw)}</span>`
        ).join("")}
      </div>` : ""}

    ${incoming.length ? `
      <h4>Incoming — referenced by (${incoming.length})</h4>
      <div class="chips">
        ${incoming.map(o => `<span class="chip" data-id="${o.id}">${escapeHtml(o.name)}</span>`).join("")}
      </div>` : ""}

    <div class="source">
      from <code>${escapeHtml(t.sourceFile || "research-topics.csv")}</code>${t.sourceDate ? ` · ${t.sourceDate}` : ""}
    </div>
  `;
  panel.classList.add("open");
  el("panel-close").addEventListener("click", closePanel);
  panel.querySelectorAll(".chip[data-id]").forEach(c => c.addEventListener("click", () => selectTopic(c.dataset.id)));
}

/* =============================================================================
   View — Catalog (workhorse). Chrome built once; results re-render on filter.
   ============================================================================= */
function renderCatalog() {
  const root = el("catalog");
  if (!root.dataset.built) { buildCatalogChrome(root); root.dataset.built = "1"; }
  syncCatalogRail();
  renderCatalogResults();
}

function buildCatalogChrome(root) {
  root.innerHTML = `
    <aside class="cat-rail">
      <div class="filter-group">
        <h3>Search</h3>
        <input type="search" id="cat-search" placeholder="topics, figures, text…" />
      </div>
      <div class="filter-group"><h3>Version</h3><div id="f-version"></div></div>
      <div class="filter-group"><h3>Discipline</h3><div id="f-discipline"></div></div>
      <div class="filter-group"><h3>Priority lane</h3><div id="f-lane"></div></div>
      <div class="filter-group"><h3>Progress</h3><div id="f-progress"></div></div>
      <button class="reset-btn" id="cat-unselect">Unselect all</button>
      <button class="reset-btn" id="cat-reset">Reset filters</button>
    </aside>
    <div class="rail-resizer" id="cat-resizer"></div>
    <div class="cat-results">
      <div class="cat-toolbar">
        <div class="count" id="cat-count"></div>
        <div class="sorts" id="cat-sorts">
          <button data-sort="discipline">by discipline</button>
          <button data-sort="connected">most connected</button>
          <button data-sort="az">A–Z</button>
        </div>
      </div>
      <div class="cards-grid" id="cat-grid"></div>
    </div>
  `;

  // Search (results-only re-render keeps the caret alive while typing).
  el("cat-search").addEventListener("input", e => { STATE.search = e.target.value.trim().toLowerCase(); renderCatalogResults(); });

  // Version checkboxes (shared filter).
  const fv = el("f-version");
  for (const v of ALL_VERSIONS) {
    const lbl = document.createElement("label");
    lbl.innerHTML = `<input type="checkbox" data-version="${v}" />
      <span class="dot" style="background:${versionColor(v)}"></span>
      <span class="lbl" style="font:11px var(--mono); text-transform:uppercase;">${v}</span>
      <span class="cnt">${VERSION_COUNTS.get(v)}</span>`;
    lbl.querySelector("input").addEventListener("change", e => {
      if (e.target.checked) STATE.versions.add(v); else STATE.versions.delete(v);
      renderCatalogResults();
    });
    fv.appendChild(lbl);
  }

  // Discipline checkboxes (empty set = all).
  const fd = el("f-discipline");
  for (const d of DISCIPLINES) {
    const lbl = document.createElement("label");
    lbl.innerHTML = `<input type="checkbox" data-disc="${d.phase}" />
      <span class="dot" style="background:${discColor(d.phase)}"></span>
      <span class="lbl" title="${escapeHtml(d.name)}">${escapeHtml(d.name)}</span>
      <span class="cnt">${d.topics.filter(x => x.targetId).length}</span>`;
    lbl.querySelector("input").addEventListener("change", e => {
      if (e.target.checked) STATE.disciplines.add(d.phase); else STATE.disciplines.delete(d.phase);
      renderCatalogResults();
    });
    fd.appendChild(lbl);
  }

  // Priority lane checkboxes.
  const fl = el("f-lane");
  for (const L of LANES) {
    const lbl = document.createElement("label");
    lbl.innerHTML = `<input type="checkbox" data-lane="${L}" />
      <span class="lbl">${L}</span><span class="cnt">${LANE_COUNTS.get(L)}</span>`;
    lbl.querySelector("input").addEventListener("change", e => {
      if (e.target.checked) STATE.lanes.add(L); else STATE.lanes.delete(L);
      renderCatalogResults();
    });
    fl.appendChild(lbl);
  }

  // Progress checkboxes (binary worked-on, surfaced as To read / Done).
  const fp = el("f-progress");
  [["toread", "To read"], ["done", "Done"]].forEach(([key, label]) => {
    const lbl = document.createElement("label");
    lbl.innerHTML = `<input type="checkbox" data-prog="${key}" />
      <span class="lbl">${label}</span>
      <span class="cnt" id="prog-cnt-${key}"></span>`;
    lbl.querySelector("input").addEventListener("change", e => {
      if (e.target.checked) STATE.progress.add(key); else STATE.progress.delete(key);
      renderCatalogResults();
    });
    fp.appendChild(lbl);
  });

  el("cat-sorts").addEventListener("click", e => {
    const b = e.target.closest("button[data-sort]"); if (!b) return;
    STATE.cardsSort = b.dataset.sort; renderCatalogResults();
  });
  // Reset = restore the defaults (every box checked) and clear the search text.
  el("cat-reset").addEventListener("click", () => {
    STATE.versions = new Set(ALL_VERSIONS);
    STATE.disciplines = new Set(DISCIPLINES.map(d => d.phase));
    STATE.lanes = new Set(LANES); STATE.progress = new Set(["toread", "done"]);
    STATE.search = ""; el("cat-search").value = "";
    syncCatalogRail(); renderCatalogResults();
  });
  // Unselect all = empty every group so no facet constrains the results. The boxes clear
  // and the full catalog stays visible, ready for the user to check just the one or few
  // filters they want. Search text is left intact.
  el("cat-unselect").addEventListener("click", () => {
    STATE.versions = new Set(); STATE.disciplines = new Set();
    STATE.lanes = new Set(); STATE.progress = new Set();
    syncCatalogRail(); renderCatalogResults();
  });

  // Drag-to-resize the filter rail (width restored + persisted inside the helper).
  makeRailResizer(el("cat-resizer"), el("catalog"), root.querySelector(".cat-rail"), "--cat-rail-w", CAT_RAIL_KEY);
}

// Reflect STATE into the rail's checkboxes (handles version toggles made from
// the graph legend while the rail stays mounted).
function syncCatalogRail() {
  el("cat-search").value = STATE.search;
  el("f-version").querySelectorAll("input").forEach(i => { i.checked = STATE.versions.has(i.dataset.version); });
  el("f-discipline").querySelectorAll("input").forEach(i => { i.checked = STATE.disciplines.has(Number(i.dataset.disc)); });
  el("f-lane").querySelectorAll("input").forEach(i => { i.checked = STATE.lanes.has(i.dataset.lane); });
  el("f-progress").querySelectorAll("input").forEach(i => { i.checked = STATE.progress.has(i.dataset.prog); });
}

function renderCatalogResults() {
  const done = [...STATE.markedIds].length;
  const toread = TOPICS.length - done;
  if (el("prog-cnt-done")) el("prog-cnt-done").textContent = done;
  if (el("prog-cnt-toread")) el("prog-cnt-toread").textContent = toread;

  const visible = visibleTopics();
  const sorted = [...visible].sort((a, b) => {
    switch (STATE.cardsSort) {
      case "connected":  return (b.inDegree + b.outDegree) - (a.inDegree + a.outDegree) || a.name.localeCompare(b.name);
      case "az":         return a.name.localeCompare(b.name);
      default:           // by discipline phase, then name
        return (discOf(a.id).phase || 99) - (discOf(b.id).phase || 99) || a.name.localeCompare(b.name);
    }
  });
  document.querySelectorAll("#cat-sorts button").forEach(b => b.classList.toggle("active", b.dataset.sort === STATE.cardsSort));
  el("cat-count").innerHTML = `showing <b>${sorted.length}</b> of ${TOPICS.length}`;

  const grid = el("cat-grid");
  grid.innerHTML = "";
  if (!sorted.length) { grid.innerHTML = `<div class="empty-note">No topics match the current filters.</div>`; return; }

  for (const t of sorted) {
    const d = discOf(t.id);
    const isMarked = STATE.markedIds.has(t.id);
    const excerpt = t.pitch ? t.pitch : ((t.description.split(/(?<=\.)\s/)[0] || "").slice(0, 150));
    const card = document.createElement("div");
    card.className = "topic-card" + (isMarked ? " marked" : "");
    card.style.borderLeftColor = d.color;
    card.innerHTML = `
      <div class="top">
        <span class="name">${escapeHtml(t.name)}</span>
        <button type="button" class="mark-toggle${isMarked ? " on" : ""}"
                aria-pressed="${isMarked}" title="${isMarked ? "Mark as to read" : "Mark as done"}">&#10003;</button>
      </div>
      ${d.phase ? `<div><span class="disc-tag" style="background:${discTint(d.color)}; color:${discInk(d.color)};">${escapeHtml(d.name)}</span></div>` : ""}
      ${t.keyFigures.length ? `<div class="figures">${escapeHtml(t.keyFigures.slice(0, 4).join(", "))}${t.keyFigures.length > 4 ? "…" : ""}</div>` : ""}
      <div class="meta">
        <span>${t.version}</span><span>${escapeHtml(LANE_OF.get(t.id))}</span>
        <span class="links">${t.inDegree + t.outDegree} links</span>
      </div>
    `;
    card.addEventListener("click", () => selectTopic(t.id));
    card.querySelector(".mark-toggle").addEventListener("click", e => { e.stopPropagation(); toggleMarked(t.id); });
    grid.appendChild(card);
  }
}

/* =============================================================================
   View — Knowledge Graph (d3 force layout, nodes coloured by discipline)
   Reuses the v0 force setup; node fill switched from version to discipline and
   the overlay gains a discipline legend + clickable version filter chips.
   ============================================================================= */
let graphSim = null, graphState = null;

function renderGraph(targetId = "graph") {
  const container = el(targetId);
  container.innerHTML = "";
  const { width, height } = container.getBoundingClientRect();

  const visible = visibleTopics();
  const visIds = new Set(visible.map(t => t.id));
  const nodes = visible.map(t => ({
    id: t.id, name: t.name, color: discOf(t.id).color,
    inDegree: t.inDegree, r: 4 + Math.sqrt(t.inDegree) * 2,
  }));
  // Per-node zoom threshold for label reveal. Rank nodes by in-degree so the top
  // hubs are always labelled (base view stays readable) and the long tail reveals
  // progressively as you zoom in, rather than every label firing at once.
  const BASE_LABELS = 12;                          // labels visible at default zoom (k=1)
  const ranked = [...nodes].sort((a, b) => b.inDegree - a.inDegree);
  ranked.forEach((n, i) => {
    if (i < BASE_LABELS) { n.labelMinK = 0; return; }
    const f = (i - BASE_LABELS) / Math.max(1, ranked.length - BASE_LABELS);
    n.labelMinK = 1.05 + f * 2.35;                 // ramps 1.05 → 3.4 across the tail
  });
  const links = EDGES
    .filter(e => visIds.has(e.source) && visIds.has(e.target) && e.source !== e.target)
    .map(e => ({ source: e.source, target: e.target }));

  const svg = d3.select(container).append("svg")
    .attr("class", "force-graph").attr("viewBox", [0, 0, width, height]);
  const rootG = svg.append("g");
  svg.call(d3.zoom().scaleExtent([0.2, 4]).on("zoom", ev => {
    rootG.attr("transform", ev.transform);
    applyLabelZoom(ev.transform.k);
  }));

  const link = rootG.append("g").attr("class", "links")
    .selectAll("line").data(links).join("line").attr("class", "link");
  const node = rootG.append("g").attr("class", "nodes")
    .selectAll("g").data(nodes).join("g").attr("class", "node")
    .call(drag()).on("click", (ev, d) => { ev.stopPropagation(); selectTopic(d.id); });

  node.append("title").text(d => d.name);
  node.append("circle").attr("r", d => d.r).attr("fill", d => d.color)
    .attr("fill-opacity", 0.88).attr("stroke", "var(--graph-bg)").attr("stroke-width", 1);
  // Every node gets a (truncated) label; visibility is driven by zoom/importance,
  // hover, and selection (see CSS + applyLabelZoom) rather than shown all at once.
  node.append("text").attr("dy", d => -d.r - 6)
    .text(d => d.name.length > 28 ? d.name.slice(0, 26) + "…" : d.name);

  // Reveal labels whose threshold the current zoom clears, and counter-scale the
  // font by k so labels stay a constant ~11px on screen at any zoom level.
  function applyLabelZoom(k) {
    node.selectAll("text")
      .attr("font-size", (11 / k).toFixed(2))
      .classed("show", d => k >= d.labelMinK);
  }
  applyLabelZoom(1);

  if (graphSim) graphSim.stop();
  graphSim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(110).strength(0.3))
    .force("charge", d3.forceManyBody().strength(d => -140 - d.r * 14)) // size-aware repulsion
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("x", d3.forceX(width / 2).strength(0.03))   // gentle pull keeps clusters from drifting
    .force("y", d3.forceY(height / 2).strength(0.03))
    .force("collide", d3.forceCollide().radius(d => d.r + 10).iterations(2))
    .on("tick", () => {
      link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

  svg.on("click", () => {                              // empty-space click clears highlight
    node.classed("dim", false).classed("highlight", false);
    link.classed("dim", false).classed("highlight", false);
  });
  graphState = { svg, link, node, nodes, links };

  buildGraphOverlay(container);
  if (STATE.selectedId && visIds.has(STATE.selectedId)) setTimeout(() => highlightGraphNeighborhood(STATE.selectedId), 50);
}

function buildGraphOverlay(container) {
  const overlay = document.createElement("div");
  overlay.className = "graph-overlay";
  overlay.innerHTML = `
    <div>
      <h4>Disciplines</h4>
      <div class="disc-legend">
        ${DISCIPLINES.map(d => `<span><span class="swatch" style="background:${discColor(d.phase)}"></span>${escapeHtml(d.name)}</span>`).join("")}
      </div>
    </div>
    <div>
      <h4>Versions · click to filter</h4>
      <div class="ver-chips">
        ${ALL_VERSIONS.map(v => `<span class="ver-chip${STATE.versions.has(v) ? "" : " off"}" data-version="${v}">${v} (${VERSION_COUNTS.get(v)})</span>`).join("")}
      </div>
    </div>
    <div class="muted">node size = in-degree · hover for label · zoom in to reveal more</div>
    <div class="gbtns"><button id="g-freeze">freeze</button><button id="g-reheat">reheat</button></div>
  `;
  container.appendChild(overlay);
  overlay.querySelectorAll(".ver-chip").forEach(chip => chip.addEventListener("click", () => {
    const v = chip.dataset.version;
    if (STATE.versions.has(v)) STATE.versions.delete(v); else STATE.versions.add(v);
    renderGraph();                                     // re-layout with the new filter
  }));
  overlay.querySelector("#g-freeze").addEventListener("click", () => graphSim.alphaTarget(0).stop());
  overlay.querySelector("#g-reheat").addEventListener("click", () => graphSim.alpha(0.5).restart());
}

function drag() {
  function started(ev, d) { if (!ev.active) graphSim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
  function dragged(ev, d) { d.fx = ev.x; d.fy = ev.y; }
  function ended(ev, d) { if (!ev.active) graphSim.alphaTarget(0); d.fx = null; d.fy = null; }
  return d3.drag().on("start", started).on("drag", dragged).on("end", ended);
}

function highlightGraphNeighborhood(id) {
  if (!graphState) return;
  const { node, link, links } = graphState;
  const idOf = (x) => (typeof x === "object" ? x.id : x);
  const neighbors = new Set([id]);
  links.forEach(l => { if (idOf(l.source) === id) neighbors.add(idOf(l.target)); if (idOf(l.target) === id) neighbors.add(idOf(l.source)); });
  node.classed("dim", d => !neighbors.has(d.id)).classed("highlight", d => d.id === id);
  link.classed("dim", l => !(idOf(l.source) === id || idOf(l.target) === id))
      .classed("highlight", l => idOf(l.source) === id || idOf(l.target) === id);
}

/* =============================================================================
   View — Thinkers (key figures aggregated across topics)
   ============================================================================= */
function renderThinkers() {
  const root = el("thinkers");
  if (!root.dataset.built) { buildThinkersChrome(root); root.dataset.built = "1"; }
  el("thinker-search").value = STATE.thinkerQuery;
  renderThinkersResults();
}
function buildThinkersChrome(root) {
  root.innerHTML = `
    <div class="thinkers-head">
      <h2>Thinkers</h2>
      <p class="sub" id="thinkers-sub"></p>
      <input type="search" id="thinker-search" placeholder="find a thinker…" />
    </div>
    <div id="thinkers-results"></div>
  `;
  el("thinker-search").addEventListener("input", e => { STATE.thinkerQuery = e.target.value.trim().toLowerCase(); renderThinkersResults(); });
}
function renderThinkersResults() {
  const visible = visibleTopics();
  const index = buildThinkerIndex(visible);
  el("thinkers-sub").textContent = `${index.size} people across ${visible.length} topics — enter through a name to see the topics it threads through.`;

  const q = STATE.thinkerQuery;
  let people = [...index.entries()];
  // Default: feature only the threaders (2+ topics). Searching reveals everyone.
  people = q ? people.filter(([name]) => name.toLowerCase().includes(q)) : people.filter(([, ids]) => ids.length >= 2);
  people.sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));

  const wrap = el("thinkers-results");
  if (!people.length) {
    wrap.innerHTML = `<div class="thinkers-empty">${q ? "No thinker matches that search." : "No multi-topic thinkers under the current filters."}</div>`;
    return;
  }
  const title = q ? `${people.length} ${people.length === 1 ? "match" : "matches"}` : "Thinkers who thread through multiple topics";
  wrap.innerHTML = `<div class="thinkers-section-title">${title}</div><div class="thinkers-grid" id="thinkers-cards"></div>`;

  const grid = el("thinkers-cards");
  for (const [name, ids] of people) {
    const creator = creatorNodeFor(name);
    const card = document.createElement("div");
    card.className = "thinker-card";
    card.innerHTML = `
      <div class="tc-head">
        <span class="tc-name">${escapeHtml(name)}</span>
        <span class="tc-count">${ids.length}</span>
        ${creator ? `<button class="tc-profile" data-id="${creator.id}">profile</button>` : ""}
      </div>
      <div class="tc-topics">
        ${ids.map(id => `<div class="chip-line" data-id="${id}">${escapeHtml(TOPIC_BY_ID.get(id).name)}</div>`).join("")}
      </div>
    `;
    card.querySelectorAll(".chip-line").forEach(c => c.addEventListener("click", () => selectTopic(c.dataset.id)));
    const prof = card.querySelector(".tc-profile");
    if (prof) prof.addEventListener("click", () => selectTopic(prof.dataset.id));
    grid.appendChild(card);
  }
}

/* =============================================================================
   View — Reader (focused, one discipline at a time)
   ============================================================================= */
function discDone(d) {
  const ids = d.topics.filter(x => x.targetId).map(x => x.targetId);
  return ids.length > 0 && ids.every(id => STATE.markedIds.has(id));
}
function renderReader() {
  const root = el("reader");
  if (!DISCIPLINES.length) { root.classList.remove("active"); root.innerHTML = ""; return; }

  const cur = DISCIPLINES.find(d => d.phase === STATE.readerPhase) || DISCIPLINES[0];
  STATE.readerPhase = cur.phase;
  const idx = DISCIPLINES.indexOf(cur);
  const next = DISCIPLINES[(idx + 1) % DISCIPLINES.length];
  const visIds = new Set(visibleTopics().map(t => t.id));

  // Resolve + filter this discipline's topics.
  const topics = cur.topics
    .map(x => x.targetId ? TOPIC_BY_ID.get(x.targetId) : null)
    .filter(t => t && visIds.has(t.id));

  root.innerHTML = `
    <aside class="reader-rail">
      <div class="rail-title">Reading path</div>
      <div id="reader-path"></div>
    </aside>
    <div class="rail-resizer" id="reader-resizer"></div>
    <div class="reader-main">
      <div class="crumb"><span class="dot-c" style="background:${cur.color2 || discColor(cur.phase)}"></span>Phase ${cur.phase} of ${DISCIPLINES.length}</div>
      <div class="ph-head">
        <div class="ph-num">${String(cur.phase).padStart(2, "0")}</div>
        <h1>${escapeHtml(cur.name)}</h1>
      </div>
      ${cur.subtitle ? `<p class="lead">${escapeHtml(cur.subtitle)}</p>` : ""}
      <div class="in-phase"><span>In this phase</span><span>${topics.length} ${topics.length === 1 ? "topic" : "topics"}</span></div>
      <div id="reader-topics"></div>
    </div>
    <aside class="reader-aside">
      <div class="up-next">
        <div class="un-kicker">Up next</div>
        <div class="un-phase">Phase ${next.phase}</div>
        <h3>${escapeHtml(next.name)}</h3>
        ${next.subtitle ? `<p>${escapeHtml(next.subtitle.slice(0, 120))}${next.subtitle.length > 120 ? "…" : ""}</p>` : ""}
        <button class="un-go" id="reader-next">Continue reading →</button>
      </div>
      <div class="aside-title">The ten phases</div>
      <div class="ten-list" id="reader-ten"></div>
    </aside>
  `;

  // Drag-to-resize the reading-path rail. The chrome is rebuilt on every render,
  // so re-wire each time; the helper re-applies the persisted width.
  makeRailResizer(el("reader-resizer"), el("reader"), root.querySelector(".reader-rail"), "--reader-rail-w", READER_RAIL_KEY);

  // Left reading-path rail.
  const path = el("reader-path");
  DISCIPLINES.forEach(d => {
    const item = document.createElement("div");
    item.className = "path-item" + (d.phase === cur.phase ? " current" : "");
    item.innerHTML = `<span class="pi-num">${String(d.phase).padStart(2, "0")}</span>
      <span class="lbl">${escapeHtml(d.name)}</span>
      ${discDone(d) ? `<span class="pi-check">&#10003;</span>` : ""}`;
    item.addEventListener("click", () => { STATE.readerPhase = d.phase; renderReader(); });
    path.appendChild(item);
  });

  // Centre topic list.
  const list = el("reader-topics");
  if (!topics.length) {
    list.innerHTML = `<div class="empty-note">No topics in this phase match the current filters.</div>`;
  } else {
    topics.forEach((t, i) => {
      const isMarked = STATE.markedIds.has(t.id);
      const excerpt = t.pitch ? t.pitch : ((t.description.split(/(?<=\.)\s/)[0] || "").slice(0, 200));
      const row = document.createElement("div");
      row.className = "reader-topic" + (isMarked ? " marked" : "");
      row.innerHTML = `
        <span class="rt-num">${String(i + 1).padStart(2, "0")}</span>
        <span class="rt-name">${escapeHtml(t.name)}</span>
        <button type="button" class="mark-toggle${isMarked ? " on" : ""}" aria-pressed="${isMarked}"
                title="${isMarked ? "Mark as to read" : "Mark as done"}">&#10003;</button>
        <div class="rt-excerpt">${escapeHtml(excerpt)}${excerpt.length >= 200 ? "…" : ""}</div>
        ${t.keyFigures.length ? `<div class="rt-figures">${escapeHtml(t.keyFigures.slice(0, 5).join(" · "))}</div>` : ""}
      `;
      row.addEventListener("click", () => selectTopic(t.id));
      row.querySelector(".mark-toggle").addEventListener("click", e => { e.stopPropagation(); toggleMarked(t.id); });
      list.appendChild(row);
    });
  }

  // Right "ten phases" list.
  const ten = el("reader-ten");
  DISCIPLINES.forEach(d => {
    const item = document.createElement("div");
    item.className = "tl-item" + (d.phase === cur.phase ? " current" : "");
    item.innerHTML = `<span>${d.phase}. ${escapeHtml(d.name)}</span><span class="tl-cnt">${d.topics.filter(x => x.targetId).length}</span>`;
    item.addEventListener("click", () => { STATE.readerPhase = d.phase; renderReader(); });
    ten.appendChild(item);
  });

  el("reader-next").addEventListener("click", () => { STATE.readerPhase = next.phase; renderReader(); });
}

/* =============================================================================
   View — Hubs (carried over from v0: in-degree / out-degree / bridge score)
   ============================================================================= */
function renderHubs() {
  const root = el("hubs");
  root.innerHTML = `
    <h2>Most-connected topics</h2>
    <div class="sub">Ranked by how the rest of the corpus references them. Bridge score rewards out-edges that span versions or disciplines — the connective glue of the dataset. Respects the active version filter.</div>
    <div class="hubs-tabs" id="hubs-tabs">
      <button data-mode="indegree"  ${STATE.hubsMode === "indegree"  ? "class='active'" : ""}>In-degree</button>
      <button data-mode="outdegree" ${STATE.hubsMode === "outdegree" ? "class='active'" : ""}>Out-degree</button>
      <button data-mode="bridges"   ${STATE.hubsMode === "bridges"   ? "class='active'" : ""}>Bridge score</button>
    </div>
    <div id="hubs-list"></div>
  `;
  el("hubs-tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-mode]"); if (!b) return;
    STATE.hubsMode = b.dataset.mode; renderHubs();
  });

  const visible = visibleTopics();
  const visIds = new Set(visible.map(t => t.id));
  function bridgeScore(t) {
    let s = 0;
    for (const c of t.connections) {
      if (!c.targetId || !visIds.has(c.targetId)) continue;
      const o = TOPIC_BY_ID.get(c.targetId);
      if (o.version !== t.version) s += 2;
      else if (discOf(o.id).phase !== discOf(t.id).phase) s += 1;
    }
    return s;
  }

  let scored;
  if (STATE.hubsMode === "indegree") {
    const inV = new Map();
    for (const t of visible) for (const c of t.connections) if (c.targetId && visIds.has(c.targetId)) inV.set(c.targetId, (inV.get(c.targetId) || 0) + 1);
    scored = visible.map(t => ({ t, val: inV.get(t.id) || 0 }));
  } else if (STATE.hubsMode === "outdegree") {
    scored = visible.map(t => ({ t, val: t.connections.filter(c => c.targetId && visIds.has(c.targetId)).length }));
  } else {
    scored = visible.map(t => ({ t, val: bridgeScore(t) }));
  }
  scored.sort((a, b) => b.val - a.val);
  scored = scored.slice(0, 30);
  const max = Math.max(1, ...scored.map(x => x.val));

  const list = el("hubs-list");
  for (const { t, val } of scored) {
    const row = document.createElement("div");
    row.className = "hub-row";
    row.innerHTML = `
      <div class="name">${escapeHtml(t.name)} <span class="dim">${t.version} · ${escapeHtml(discOf(t.id).name)}</span></div>
      <div class="bar-wrap"><div class="bar" style="width:${(val / max * 100).toFixed(1)}%; background:${discOf(t.id).color}"></div></div>
      <div class="num">${val}</div>
    `;
    row.addEventListener("click", () => selectTopic(t.id));
    list.appendChild(row);
  }
}

/* =============================================================================
   URL hash sync — #view=catalog&topic=v5-...
   ============================================================================= */
function syncHash() {
  const params = new URLSearchParams();
  params.set("view", STATE.view);
  if (STATE.selectedId) params.set("topic", STATE.selectedId);
  history.replaceState(null, "", "#" + params.toString());
}
function readHash() {
  const params = new URLSearchParams(location.hash.replace(/^#/, ""));
  const v = params.get("view"), t = params.get("topic");
  if (v && document.querySelector(`[data-view="${v}"]`)) STATE.view = v;
  if (t && TOPIC_BY_ID.has(t)) STATE.selectedId = t;
}
window.addEventListener("hashchange", () => {
  const prev = STATE.view;
  readHash();
  if (prev !== STATE.view) setView(STATE.view);
  renderPanel();
});
window.addEventListener("keydown", e => { if (e.key === "Escape" && STATE.selectedId) closePanel(); });
window.addEventListener("resize", () => { if (STATE.view === "graph") renderGraph(); });

/* =============================================================================
   Boot
   ============================================================================= */
el("tagline").textContent = `Research Vault · ${TOPICS.length} topics · ${DISCIPLINES.length} disciplines`;
updateProgressMeter();
readHash();
setView(STATE.view);
if (STATE.selectedId) renderPanel();
</script>
</body>
